name: Android companion build

on:
  push:
    branches: [feature/health-connect]
    paths:
      - "android/**"
      - ".github/workflows/android-health-connect.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-health-connect.yml"
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android
